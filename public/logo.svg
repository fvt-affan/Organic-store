<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <!-- Icon (Left Side) -->
  <g transform="translate(30, 25)">
    <!-- Green Rounded Badge -->
    <rect x="0" y="0" width="130" height="130" rx="35" fill="#2E7D32" />
    
    <!-- Grocery Basket Outline -->
    <path d="M 35 55 L 95 55 L 88 100 L 42 100 Z" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M 45 55 C 45 35 85 35 85 55" fill="none" stroke="#81C784" stroke-width="5" stroke-linecap="round" />
    
    <!-- Fresh Leaf Rising from Basket -->
    <path d="M 65 65 C 65 40 90 35 90 35 C 90 35 90 60 65 65 Z" fill="#81C784" />
    <path d="M 65 65 C 65 45 45 40 45 40 C 45 40 45 60 65 65 Z" fill="#A5D6A7" />
  </g>

  <!-- Typography -->
  <g transform="translate(185, 65)">
    <!-- Brand Name: PureHarvest -->
    <text x="0" y="42" 
          font-family="Poppins, 'Nunito', 'Segoe UI', sans-serif" 
          font-size="44" 
          font-weight="700" 
          fill="#1B5E20">Pure<tspan fill="#4CAF50">Harvest</tspan></text>
    
    <!-- Tagline: FRESH & ORGANIC MARKET -->
    <text x="2" y="70" 
          font-family="Poppins, 'Segoe UI', sans-serif" 
          font-size="14" 
          font-weight="500" 
          fill="#666666" 
          letter-spacing="3.5">FRESH &amp; ORGANIC MARKET</text>
  </g>
</svg>
